name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: staticcheck
        if: matrix.go == 'stable'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go test -race -cover ./...
      - name: Example in input mode has no breaking changes
        run: go run ./cmd/schema-guard -mode input -pointer /components/schemas/Order examples/orders-v1.json examples/orders-v2.json
